name: Build Fabric 1.21.4 mod
concurrency:
  group: scoreboard-build-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [arena/d7c6e662-08g7wrq8976gq8gw7r]
    paths-ignore: ['downloads/**', '**.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - name: Compile, test and remap for Fabric
        run: ./gradlew --no-daemon build
      - name: Start actual Minecraft client under virtual display
        run: |
          set -o pipefail
          mkdir -p run-smoke
          printf 'onboardAccessibility:false\nmaxFps:60\nsoundCategory_master:0.0\nlang:ru_ru\n' > run-smoke/options.txt
          timeout 300 xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew --no-daemon runSmokeClient 2>&1 | tee smoke.log
          grep -q 'SCOREBOARD_SMOKE_PASS' smoke.log
      - name: Preserve diagnostic log on failure
        if: failure()
        run: |
          mkdir -p downloads
          cp smoke.log downloads/smoke-failure.log 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads
          if ! git diff --cached --quiet; then
            git commit -m 'test: save smoke diagnostics [skip ci]'
            git push origin HEAD:arena/d7c6e662-08g7wrq8976gq8gw7r
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: scoreboard-tweaks-1.0.0-mc1.21.4
          path: build/libs/scoreboard-tweaks-1.0.0.jar
      - name: Save small distributable on the session branch
        if: github.ref == 'refs/heads/arena/d7c6e662-08g7wrq8976gq8gw7r'
        run: |
          mkdir -p downloads
          cp build/libs/scoreboard-tweaks-1.0.0.jar downloads/scoreboard-tweaks-1.0.0-mc1.21.4.jar
          sha256sum downloads/*.jar > downloads/SHA256SUMS.txt
          cp smoke.log downloads/smoke-test.log
          rm -f downloads/smoke-failure.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish tested Fabric mod [skip ci]'
            git push origin HEAD:arena/d7c6e662-08g7wrq8976gq8gw7r
          fi
