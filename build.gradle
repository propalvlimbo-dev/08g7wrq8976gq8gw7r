plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
jar { from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } } }
tasks.register('coreTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.scoreboardtweaks.core.CoreSelfTest'
}
check.dependsOn coreTest

// A separate development-only mod exercises the actual Minecraft renderer under Xvfb.
// It is NOT included in the distributable JAR.
sourceSets {
    smoke {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
loom {
    runs {
        smokeClient {
            client()
            source sourceSets.smoke
            runDir 'run-smoke'
            vmArg '-Dscoreboardtweaks.smoke=true'
        }
    }
    mods {
        scoreboardtweaks { sourceSet sourceSets.main }
        scoreboardtweaks_smoke { sourceSet sourceSets.smoke }
    }
}
